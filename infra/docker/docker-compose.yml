services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: studytree
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d studytree"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${MIGRATIONS_DIR}:/migrations:ro
    command:
      [ "-path", "/migrations", "-database", "postgres://study:study@db:5432/studytree?sslmode=disable", "up" ]

volumes:
  pgdata: {}
